<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>Victoria Mobile Sauna Rentals - Floating Wellness & Mobile Sauna Experiences</title>
  <meta name="title" content="Victoria Mobile Sauna Rentals - Floating Wellness & Mobile Sauna Experiences" />
  <meta name="description"
    content="Experience the ultimate relaxation with our unique floating sauna boat rentals and mobile sauna services in Victoria, BC. Book your wellness journey today." />
  <meta name="keywords"
    content="sauna rental, floating sauna, mobile sauna, Victoria BC, wellness, spa, boat rental, sauna boat, health, relaxation" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://victoriasaunarentals.ca/" />
  <meta property="og:title" content="Victoria Mobile Sauna Rentals - Floating Wellness Experiences" />
  <meta property="og:description"
    content="Experience the ultimate relaxation with our unique floating sauna adventures and mobile sauna rentals in Victoria, BC. Book your wellness journey today." />
  <meta property="og:image" content="https://victoriasaunarentals.ca/images/carousel/sauna1.webp" />
  <meta property="og:site_name" content="Victoria Mobile Sauna Rentals" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://victoriasaunarentals.ca/" />
  <meta property="twitter:title" content="Victoria Mobile Sauna Rentals - Floating Wellness Experiences" />
  <meta property="twitter:description"
    content="Experience the ultimate relaxation with our unique floating sauna adventures and mobile sauna rentals in Victoria, BC." />
  <meta property="twitter:image" content="https://victoriasaunarentals.ca/images/carousel/sauna1.webp" />

  <!-- Mobile App Meta -->
  <meta name="theme-color" content="#2f3a24" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Victoria Sauna Rentals" />

  <!-- DNS Prefetch & Preconnect for performance -->
  <link rel="dns-prefetch" href="//victoriasaunarentals.ca" />
  <link rel="preconnect" href="https://victoriasaunarentals.ca" />

  <!-- Google Fonts — Brand Typography (Baskerville + Franklin Gothic approximations) -->
  <!-- TO UPGRADE: replace these two links with the Adobe Fonts kit URL when client provides it -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Preload hero/carousel critical image to reduce LCP — only resource that needs high priority -->
  <link rel="preload" as="image" href="/images/carousel/sauna1-mobile.webp" type="image/webp" fetchpriority="high"
    media="(max-width: 768px)" />
  <link rel="preload" as="image" href="/images/carousel/sauna1.webp" type="image/webp" fetchpriority="high"
    media="(min-width: 769px)" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/logos/logo-flame.png" />

  <!-- Web App Manifest -->
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://victoriasaunarentals.ca/" />

  <!-- Structured Data (JSON-LD) for Local Business -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Victoria Mobile Sauna Rentals",
      "description": "Floating sauna boat rentals and mobile sauna services in Victoria, BC",
      "url": "https://victoriasaunarentals.ca",
      "image": "https://victoriasaunarentals.ca/images/carousel/sauna1.webp",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Victoria",
        "addressRegion": "BC",
        "addressCountry": "CA"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "48.4284",
        "longitude": "-123.3656"
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
        "opens": "09:00",
        "closes": "21:00"
      }
    }
    </script>

  <!-- Critical CSS - Inlined to prevent render blocking and improve LCP -->
  <style>
    /* Self-hosted @font-face — inlined to avoid render-blocking stylesheet request */
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/inter-400.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('/fonts/inter-500.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('/fonts/inter-600.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('/fonts/inter-700.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Playfair Display';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('/fonts/playfair-600.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Playfair Display';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('/fonts/playfair-700.woff2') format('woff2');
    }

    /* Critical Reset */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Critical Root Styles */
    html {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Root container */
    #root {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      width: 100%;
    }

    /* Critical Hero Styles - Prevent CLS */
    .image-carousel,
    .carousel-container,
    .hero {
      min-height: 600px;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .carousel-slide {
      min-height: 600px;
      height: 100%;
      width: 100%;
    }

    .carousel-content {
      min-height: 300px;
    }

    .carousel-content h1,
    .image-carousel__title,
    .hero h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 700;
      margin-bottom: 1rem;
      font-family: 'Playfair Display', Georgia, serif;
      line-height: 1.2;
      min-height: 80px;
    }

    /* Critical Footer - Prevent CLS */
    .footer {
      background-color: #333333;
      color: #FEFCF7;
      margin-top: auto;
      min-height: 400px;
    }

    /* Critical Button Styles */
    .btn,
    button {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      cursor: pointer;
      border: none;
      outline: none;
    }

    /* Critical Container */
    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* Hide elements until fully loaded */
    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
